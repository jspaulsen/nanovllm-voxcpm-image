name: publish

on:
  push:
    branches: [main, feat/2-ghcr-publish]  # TEMP: branch trigger for verification, remove before merge
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The CUDA devel builder stage plus the venv need far more than the runner's free space.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          docker image prune --all --force
          df -h /

      # Single source of truth for the upstream commit: the Dockerfile's ARG default.
      - name: Read upstream ref
        id: upstream
        run: |
          ref=$(sed -n 's/^ARG UPSTREAM_REF=//p' Dockerfile)
          test -n "$ref"
          echo "short=${ref:0:7}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value=upstream-${{ steps.upstream.outputs.short }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Inspect pushed image
        run: docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}"
