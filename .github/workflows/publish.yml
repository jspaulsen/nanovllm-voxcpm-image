name: publish

on:
  push:
    branches: [main, feat/2-ghcr-publish]  # TEMP: branch trigger for verification, remove before merge
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # fail fast if flash-attn ever falls back to a source build
    steps:
      - uses: actions/checkout@v7

      # The CUDA devel builder stage plus the venv need ~45 GB; the runner starts with ~14 GB free on /.
      - name: Free runner disk
        run: |
          df -h /
          docker image prune --all --force
          sudo swapoff -a && sudo rm -f /swapfile /mnt/swapfile
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" \
            /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift /usr/lib/jvm \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/vcpkg /usr/share/miniconda \
            /opt/microsoft /opt/google /opt/az /opt/pipx /usr/local/julia*
          { sudo du -xh -d2 / 2>/dev/null || true; } | sort -h | tail -15  # TEMP: find what is left
          df -h /

      # Single source of truth for the upstream commit: the Dockerfile's ARG default.
      - name: Read upstream ref
        id: upstream
        run: |
          ref=$(sed -n 's/^ARG UPSTREAM_REF=//p' Dockerfile)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "short=${ref:0:7}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=raw,value=upstream-${{ steps.upstream.outputs.short }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Inspect pushed image
        run: |
          docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}"
          df -h /
