name: publish

on:
  push:
    branches: [main, feat/2-ghcr-publish]  # TEMP: branch trigger for verification, remove before merge
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # fail fast if flash-attn ever falls back to a source build
    steps:
      - uses: actions/checkout@v7

      # The CUDA devel builder stage plus the venv need far more than the runner's free space on /.
      # Free / and move Docker (and so the buildx builder's state) to the larger /mnt disk.
      - name: Free runner disk
        run: |
          df -h / /mnt
          docker image prune --all --force
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" \
            /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift /usr/lib/jvm \
            /usr/local/share/powershell /opt/microsoft /opt/google
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } \
            | jq '. + {"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json.new
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format '{{.DockerRootDir}}'
          df -h / /mnt

      # Single source of truth for the upstream commit: the Dockerfile's ARG default.
      - name: Read upstream ref
        id: upstream
        run: |
          ref=$(sed -n 's/^ARG UPSTREAM_REF=//p' Dockerfile)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "short=${ref:0:7}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=raw,value=upstream-${{ steps.upstream.outputs.short }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Inspect pushed image
        run: |
          docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}"
          df -h / /mnt
